<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- 页面标题 --></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* === CSS变量（Token 体系，与 brand-dna.md 同步）=== */
    :root { --_kai-ds: "jokerwon-v1";
      /* ===== 基础 Token 层（主题变更只改这里） ===== */
      --c-base: #FCFCFC;                       /* 空（基底）：页面底色 */
      --c-primary: #2F4767;                    /* 主色：标题、主色块、主按钮 */
      --c-primary-deep: #243C6C;               /* 主色暗变体：深色面板、hover */
      --c-primary-bright: #3C546C;             /* 主色亮变体：分层 */
      --c-accent: #FAD470;                     /* 唯一强调（姜黄）：下划线/徽章/高亮，≤5% */
      --c-accent-soft: rgba(250, 212, 112, 0.18); /* 强调浅底 */
      --c-ink: #2A2624;                        /* 中性深：标题文字、手绘轮廓 */
      --c-text: #303A43;                       /* 中性灰蓝：正文、次要元素 */
      --c-text-faint: rgba(48, 58, 67, 0.55);  /* 辅助文字 */
      --c-warm: #F3C7A1;                       /* 暖辅：卡片底、温和提示 */
      --c-warm-deep: #F3BB99;                  /* 暖辅胭红变体 */
      --c-warm-soft: rgba(243, 199, 161, 0.12);   /* 暖辅浅底：交替背景 */
      --c-line: #0C0C0C;                       /* 近黑手绘描边 */
      /* ===== 语义别名层（旧变量名兼容，下游 var() 引用零改动） ===== */
      --yellow: var(--c-accent);
      --yellow-soft: var(--c-accent-soft);
      --blue: var(--c-primary);
      --blue-deep: var(--c-primary-deep);
      --red: var(--c-warm-deep);
      --cream: var(--c-base);
      --cream-dark: var(--c-warm-soft);
      --ink: var(--c-ink);
      --ink-light: var(--c-text);
      --ink-faint: var(--c-text-faint);
      --dark-panel: var(--c-primary-deep);
    }

    /* === Reset === */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: var(--ink);
      background: var(--cream);
    }

    ::selection {
      background: var(--yellow);
      color: var(--ink);
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* === Hero Section === */
    /* 替换为适合的Hero布局（参见layouts.md） */
    .hero {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 0.6fr;
      align-items: center;
      gap: 48px;
      padding: 6rem 2rem 4rem;
      max-width: 1300px;
      margin: 0 auto;
    }

    .hero h1 {
      font-family: 'Noto Serif SC', serif;
      font-weight: 900;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      line-height: 1.15;
    }

    .hero p {
      font-size: 1.05rem;
      color: var(--ink-light);
      margin-top: 1.5rem;
      max-width: 540px;
    }

    .label-caps {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 500;
      color: var(--ink-faint);
      display: block;
      margin-bottom: 0.75rem;
    }

    /* === Content Sections === */
    /* 每个section使用不同布局（参见layouts.md） */
    .section {
      padding: clamp(80px, 12vh, 160px) 0;
    }

    .section--alt {
      background: var(--cream-dark);
    }

    .section-header {
      margin-bottom: clamp(40px, 6vw, 80px);
    }

    .section-number {
      font-family: Georgia, 'Songti SC', serif;
      font-size: clamp(1.4rem, 3vw, 2rem);
      color: var(--blue);
      display: block;
      margin-bottom: 0.25rem;
    }

    .section-title {
      font-family: 'Noto Serif SC', serif;
      font-weight: 900;
      font-size: clamp(1.4rem, 3vw, 2.2rem);
    }

    /* === 卡片 === */
    .feature-card {
      background: var(--cream-dark);
      border-radius: 12px;
      padding: clamp(24px, 3vw, 36px);
      border-bottom: 4px solid var(--yellow);
      transition: transform 0.3s ease;
    }
    .feature-card:hover { transform: translateY(-4px); }

    /* === Scroll Reveal === */
    .reveal {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal.visible { opacity: 1; transform: none; }
    .reveal-d1 { transition-delay: 0.1s; }
    .reveal-d2 { transition-delay: 0.2s; }
    .reveal-d3 { transition-delay: 0.3s; }
    .reveal-d4 { transition-delay: 0.4s; }
    .reveal-d5 { transition-delay: 0.5s; }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
    }

    /* === 响应式 === */
    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        min-height: auto;
        padding: 4rem 1.5rem 3rem;
      }
    }

    @media (max-width: 600px) {
      body { font-size: 15px; }
    }
  </style>
</head>
<body>

  <!-- ====== HERO ====== -->
  <!-- 从layouts.md选择合适的Hero布局 -->
  <section class="hero">
    <div class="hero-text">
      <span class="label-caps"><!-- 分类标签 --></span>
      <h1><!-- 主标题 --></h1>
      <p><!-- 副标题/描述 --></p>
    </div>
    <div class="hero-visual">
      <!-- 视觉元素：图片/装饰/IP形象 -->
    </div>
  </section>

  <!-- ====== SECTION 1 ====== -->
  <!-- 选择不同于Hero的布局（如Sticky侧栏/Step流程/卡片网格） -->
  <section class="section">
    <div class="container">
      <div class="section-header reveal">
        <span class="section-number">01</span>
        <h2 class="section-title"><!-- Section标题 --></h2>
      </div>
      <div class="reveal reveal-d1">
        <!-- Section内容 -->
      </div>
    </div>
  </section>

  <!-- ====== SECTION 2 ====== -->
  <!-- 选择另一种不同布局 -->
  <section class="section section--alt">
    <div class="container">
      <div class="section-header reveal">
        <span class="section-number">02</span>
        <h2 class="section-title"><!-- Section标题 --></h2>
      </div>
      <div class="reveal reveal-d1">
        <!-- Section内容 -->
      </div>
    </div>
  </section>

  <!-- ====== SECTION 3 ====== -->
  <!-- 可选：深色面板打破节奏 -->
  <section class="section" style="background: var(--dark-panel); color: #FCFCFC;">
    <div class="container">
      <div class="reveal">
        <!-- 重点内容/引用 -->
      </div>
    </div>
  </section>

  <!-- ====== FOOTER ====== -->
  <footer class="section" style="padding: clamp(40px, 6vh, 80px) 0; text-align: center;">
    <div class="container">
      <p style="font-size: 0.85rem; color: var(--ink-faint);"><!-- 底部信息 --></p>
    </div>
  </footer>

  <!-- ====== Scroll Reveal JS ====== -->
  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>
<!-- Based on esther-design-system by ESTHER不二 (esthersjw), CC BY-NC-SA 4.0. Modifications by Kai (jokerwon). -->
<section style="position:absolute;left:-9999px;font-size:0;line-height:0;opacity:0;height:0;overflow:hidden;">kai-design-system</section>
</body>
</html>
